<!doctype html>
<html lang="{{ 'zh-Hant' if lang=='zh' else 'en' }}">


















<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tendline Board — {{ t.pm_title }}</title>
<style>
  


  :root{
    color-scheme: light dark;
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2f8; --line:#d8e0ec;
    --track:#e6ebf3; --fg:#1b2433; --mut:#5c6b82; --hover:#b9c6db; --unk:#b07d12;
    --good:#1f9d57; --warn:#b07d12; --bad:#c4504f;

    --st-repair:#dc2626;   --sti-repair:#ffffff;     
    --st-pm:#2563eb;       --sti-pm:#ffffff;         
    --st-legacy:#9ca3af;   --sti-legacy:#1b2433;
    --st-parts:#6b21a8;    --sti-parts:#ffffff;
    --st-vendor:#d97706;   --sti-vendor:#1b2433;
    --st-hwait:#8b98a9;    --sti-hwait:#ffffff;
    --tex-stripe:rgba(0,0,0,.30);

    






    --pm-age1:#8b98a9; --pm-age2:#b07d12; --pm-age3:#c4803f; --pm-age4:#c4504f;
    --pm-seg1:#7c93b5; --pm-seg2:#41608c; --pm-seg3:#b8c6da;

    




    --pm-area-za:#3f7a8c; --pm-area-zb:#5a6fae; --pm-area-zc:#3f7f63; --pm-area-zd:#8a6aa8;

    





    --pm-bar:#b9c9e0; --pm-bar2:#7d95b8;

    




    --pm-line1:#2f5597; --pm-line2:#9c5fb0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --panel:#141d2e; --panel2:#1b2740; --line:#2a3852;
      --track:#0e1626; --fg:#e6edf6; --mut:#8aa0bd; --hover:#3a5c86; --unk:#cbb26b;
      --good:#36c47f; --warn:#cbb26b; --bad:#e0726f;
      --st-parts:#b26ef5;  --sti-parts:#1b2433;
      --pm-age1:#8aa0bd; --pm-age2:#cbb26b; --pm-age3:#d9a06a; --pm-age4:#e0726f;
      --pm-seg1:#5a7ba6; --pm-seg2:#8fb0d8; --pm-seg3:#33456180;
      --pm-area-za:#6fb3c6; --pm-area-zb:#93a6e0; --pm-area-zc:#6fbf95; --pm-area-zd:#bda0dc;
      --pm-bar:#3a4f6f; --pm-bar2:#6b87b0;
      --pm-line1:#7fa6e8; --pm-line2:#c69ad8;
    }
  }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:14px/1.5 "Segoe UI",system-ui,"Microsoft JhengHei",sans-serif }
  a{ color:inherit }
  main{ max-width:1240px; margin:0 auto; padding:18px 22px 40px }

   
  .pm-head{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:2px 0 4px }
  .pm-head h1{ font-size:22px; font-weight:800; letter-spacing:.3px; margin:0 }
  .pm-head .sub{ color:var(--mut); font-size:13.5px }
  .pm-ctl{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 2px 16px }
  .pm-back{ font-size:13px; color:var(--mut); text-decoration:none; border:1px solid var(--line);
        border-radius:8px; padding:4px 12px; margin-right:6px }
  .pm-back:hover{ border-color:var(--hover); color:var(--fg) }
  .pm-wchip{ font-size:12px; color:var(--mut); padding:4px 13px; border-radius:8px;
        border:1px solid var(--line); background:var(--panel); text-decoration:none; white-space:nowrap }
  .pm-wchip:hover{ border-color:var(--hover); color:var(--fg) }
  .pm-wchip.on{ color:var(--fg); font-weight:700; background:var(--panel2); border-color:var(--hover) }

  






  .pm-zbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        margin:26px 2px 11px; padding:0 1px 7px; border-bottom:1px solid var(--line) }
  .pm-zbar:first-of-type{ margin-top:4px }
  .pm-zbar .zn{ font-size:12px; font-weight:800; letter-spacing:.7px; text-transform:uppercase;
        color:var(--mut) }
  .pm-zbar .zc{ font-size:11.5px; color:var(--mut); padding:1px 9px; border-radius:9px;
        border:1px solid var(--line); background:var(--panel2) }
  .pm-zbar .zctl{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  

  .pm-tchip{ font-size:10.5px; font-weight:600; letter-spacing:.2px; color:var(--mut);
        border:1px solid var(--line); border-radius:8px; padding:0 7px; margin-left:8px;
        vertical-align:1.5px; white-space:nowrap }

   
  .help{ position:relative; display:inline-flex; align-items:center; justify-content:center;
         width:14px; height:14px; border-radius:50%; border:1px solid var(--line); color:var(--mut);
         font-size:10px; font-weight:700; cursor:help; vertical-align:1px; margin-left:5px }
  .help .tip{ display:none; position:absolute; z-index:40; top:19px; left:50%; transform:translateX(-50%);
         width:300px; background:var(--fg); color:var(--bg); font-size:11.5px; font-weight:400;
         line-height:1.55; padding:8px 11px; border-radius:8px; text-align:left; white-space:normal;
         text-transform:none; letter-spacing:0 }
  .help:hover .tip, .help:focus .tip{ display:block }
  .help .tip.r{ left:auto; right:-8px; transform:none }

   
  .pm-sec{ border:1px solid var(--line); border-radius:14px; background:var(--panel);
        padding:18px 20px; margin:0 0 18px }
  .pm-sec > h2{ font-size:15px; font-weight:800; letter-spacing:.3px; margin:0 0 4px }
  .pm-secnote{ color:var(--mut); font-size:12px; margin:0 0 12px }

  


  .pm-hero{ display:flex; align-items:baseline; gap:34px; flex-wrap:wrap; margin:6px 0 8px }
  .pm-hero .kpi{ display:flex; align-items:baseline; gap:9px }
  .pm-hero .big{ font-size:54px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums }
  .pm-hero .lbl{ color:var(--mut); font-size:13px }
  .pm-due{ font-size:13px; margin:2px 0 8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  .pm-due .n{ font-variant-numeric:tabular-nums; font-weight:700 }
  .pm-due .st{ color:var(--mut) }
  .pm-line{ font-size:12.5px; color:var(--mut); margin:3px 0 }
  .pm-line b{ color:var(--fg); font-variant-numeric:tabular-nums }
  .pm-alert{ font-size:13px; margin:10px 0 2px; padding:8px 13px; border-radius:9px;
        border:1px solid var(--line); background:var(--panel2) }
  .pm-alert .bk{ font-weight:700 }
  .pm-buckets{ display:inline-flex; gap:8px; flex-wrap:wrap; margin-left:6px }
  .pm-bkchip{ font-size:11.5px; padding:1px 8px; border-radius:9px; border:1px solid var(--line);
        color:var(--mut); font-variant-numeric:tabular-nums }

   
  .pm-tblwrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; margin-top:6px }
  table.pm-tbl{ width:100%; border-collapse:collapse; font-size:12.5px }
  table.pm-tbl th{ background:var(--panel2); color:var(--mut); font-size:10px; text-transform:uppercase;
        letter-spacing:.3px; padding:7px 10px; white-space:nowrap; text-align:right }
  table.pm-tbl th:nth-child(1), table.pm-tbl th:nth-child(2), table.pm-tbl th:nth-child(3){ text-align:left }
  table.pm-tbl td{ padding:6px 10px; border-top:1px solid var(--line); text-align:right;
        font-variant-numeric:tabular-nums; white-space:nowrap }
  table.pm-tbl td:nth-child(1), table.pm-tbl td:nth-child(2), table.pm-tbl td:nth-child(3){ text-align:left }
  table.pm-tbl tr.pm-row{ cursor:pointer }
  table.pm-tbl tr.pm-row:hover td{ background:var(--panel2) }
  table.pm-tbl td.mut{ color:var(--mut) }
  


  .pm-nm{ display:block; white-space:normal }
  .pm-code{ display:block; font-size:10.5px; line-height:1.4 }
  .pm-areachip{ font-size:10px; padding:0 7px; border-radius:8px; border:1px solid var(--line);
        color:var(--mut); margin-left:6px }
   
  .pm-areachip.pm-a-za{ color:var(--pm-area-za); border-color:var(--pm-area-za) }
  .pm-areachip.pm-a-zb{ color:var(--pm-area-zb); border-color:var(--pm-area-zb) }
  .pm-areachip.pm-a-zc{ color:var(--pm-area-zc); border-color:var(--pm-area-zc) }
  .pm-areachip.pm-a-zd{ color:var(--pm-area-zd); border-color:var(--pm-area-zd) }
  .pm-zchip{ display:inline-block; font-size:9px; font-weight:700; letter-spacing:.3px; padding:0 6px;
        border-radius:7px; border:1px solid var(--warn); color:var(--warn); margin-left:6px; cursor:help }
   
  .pm-age1{ color:var(--pm-age1) } .pm-age2{ color:var(--pm-age2) }
  .pm-age3{ color:var(--pm-age3) } .pm-age4{ color:var(--pm-age4); font-weight:700 }
   
  tr.pm-drillrow > td{ padding:0; border-top:none }
  .pm-drillslot:empty{ display:none }
  .pm-drill{ border:1px solid var(--line); border-radius:12px; background:var(--panel2);
        padding:14px 16px; margin:2px 2px 12px }
  .pm-drill-h{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 0 8px }
  .pm-drill-h .t{ font-weight:700 }
  .pm-drill-h .close{ margin-left:auto; font-size:12px; color:var(--mut); cursor:pointer }
  .pm-drill-h .close:hover{ color:var(--fg) }
  .pm-meta{ display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--mut); margin:0 0 12px }
  .pm-meta b{ color:var(--fg); font-variant-numeric:tabular-nums }
  .pm-sub-h{ font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px;
        margin:12px 0 5px; display:flex; align-items:center }
  .pm-steps{ width:100%; border-collapse:collapse; font-size:12.5px }
  .pm-steps th{ text-align:left; color:var(--mut); font-size:10px; text-transform:uppercase;
        padding:4px 8px; border-bottom:1px solid var(--line) }
  .pm-steps td{ padding:5px 8px; border-top:1px solid var(--line); vertical-align:top }
  .pm-steps td.seq{ font-variant-numeric:tabular-nums; color:var(--mut); width:44px }
  .pm-steps td.parts{ color:var(--mut); white-space:nowrap }
  

  .pm-steps a.pm-part{ color:var(--mut); text-decoration:underline dotted;
        text-underline-offset:2px; text-decoration-color:var(--line) }
  .pm-steps a.pm-part:hover{ color:var(--fg); text-decoration-color:var(--hover) }
  .pm-cmms{ font-size:12px; color:var(--mut); text-decoration:none; margin-left:8px }
  .pm-cmms:hover{ color:var(--fg) }

  


  .pm-own{ display:flex; flex-direction:column; gap:9px; margin:4px 0 2px }
  .pm-ownrow{ display:grid; grid-template-columns:170px 1fr 200px; gap:12px; align-items:center;
        font-size:12.5px }
  .pm-ownrow .who{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .pm-ownrow.unassigned .who{ color:var(--unk); font-weight:800 }
  .pm-bar{ display:flex; height:20px; border-radius:6px; overflow:hidden; background:var(--track);
        border:1px solid var(--line) }
  .pm-bar > span{ height:100%; display:flex; align-items:center; justify-content:center;
        font-size:10.5px; color:var(--bg); font-variant-numeric:tabular-nums; overflow:hidden }
  .pm-bar .s1{ background:var(--pm-seg1) } .pm-bar .s2{ background:var(--pm-seg2) }
  .pm-bar .s3{ background:var(--pm-seg3) }
  .pm-ownrow .side{ color:var(--mut); font-size:11.5px; text-align:right; white-space:nowrap }
  .pm-ownrow .side b{ color:var(--fg); font-variant-numeric:tabular-nums }
  .pm-ownlegend{ display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 2px; font-size:11.5px;
        color:var(--mut) }
  .pm-ownlegend .li{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap }
  .pm-ownlegend .d{ width:11px; height:11px; border-radius:3px; display:inline-block; flex:none }

   
  .pm-fc{ display:flex; gap:14px; flex-wrap:wrap }
  .pm-fccard{ flex:1 1 260px; border:1px solid var(--line); border-radius:11px; padding:12px 14px;
        background:var(--panel2) }
  .pm-fccard .hd{ font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px }
  .pm-fccard .big{ font-size:19px; font-weight:800; margin:4px 0 6px; font-variant-numeric:tabular-nums }
  .pm-fccard .ow{ font-size:11.5px; color:var(--mut); line-height:1.7 }

   
  .pm-trwrap{ overflow-x:auto }
  .pm-tr{ width:100%; height:auto; max-width:820px; display:block }
  .pm-tr .axl{ fill:var(--mut); font-size:9.5px; font-variant-numeric:tabular-nums }
  .pm-tr .axl.mo{ font-size:9px }
  

  .pm-tr .axl.n{ font-size:8.5px; opacity:.85 }
  .pm-tr .grid{ stroke:var(--line); stroke-width:1 }
  

  .pm-tr .pm-dot{ stroke:none }
  


  .pm-tr .pm-trbar{ fill:var(--pm-bar); opacity:.85 }
  .pm-tr .pm-trbar2{ fill:var(--pm-bar2); opacity:.95 }
   
  .pm-tr .pm-trlbl{ fill:var(--mut); font-size:8.5px; font-variant-numeric:tabular-nums }
   
  .pm-tr .pm-trhit{ fill:transparent }
  .pm-ownlegend .pm-barswatch{ background:var(--pm-bar) }
  .pm-ownlegend .pm-barswatch2{ background:var(--pm-bar2) }

   
  .pm-owntotal{ font-size:12.5px; color:var(--mut); padding:7px 11px; margin:2px 0 8px;
        border:1px solid var(--line); border-radius:9px; background:var(--panel2) }
  .pm-owntotal b{ color:var(--fg); font-variant-numeric:tabular-nums }

  




  table.pm-pptbl td{ vertical-align:middle }
  table.pm-pptbl tr.unassigned td:first-child{ color:var(--unk); font-weight:800 }

  






  .pm-sm-grid{ display:grid; gap:10px; margin:10px 0 2px;
        grid-template-columns:repeat(auto-fill, minmax(178px, 1fr)) }
  .pm-smcell{ border:1px solid var(--line); border-radius:10px; background:var(--panel2);
        padding:8px 10px 6px }
  .pm-smcell .who{ font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden;
        text-overflow:ellipsis }
  .pm-smcell .sm-note{ color:var(--mut); font-size:10.5px; font-variant-numeric:tabular-nums }
  .pm-smchart{ width:100%; height:auto; display:block; margin:3px 0 1px }
  .pm-smchart .grid{ stroke:var(--line); stroke-width:1 }
  .pm-smchart .pm-smhit{ fill:transparent }

   
  .pm-srcbanner{ display:flex; gap:10px; align-items:flex-start; margin:0 0 16px; padding:10px 15px;
        border:1px solid var(--unk); border-radius:11px; background:rgba(176,125,18,.10); font-size:12.5px }
  .pm-srcbanner .pin{ font-weight:800; color:var(--unk); white-space:nowrap }
  .pm-off{ font-size:13px; color:var(--unk); padding:14px 16px; border:1px dashed var(--line);
        border-radius:11px; background:var(--panel2); line-height:1.6; margin-bottom:14px }
  .pm-none{ color:var(--mut); font-size:13px; font-style:italic }
  .pm-foot{ color:var(--mut); font-size:11.5px; margin:6px 2px 0; line-height:1.65 }
  .loading{ display:flex; align-items:center; gap:9px; color:var(--mut); font-size:12.5px; padding:26px 2px }
  .spin{ width:14px; height:14px; border:2px solid var(--track); border-top-color:var(--mut);
         border-radius:50%; animation:sp .8s linear infinite }
  @keyframes sp{ to{ transform:rotate(360deg) } }
  .pm-unavail{ font-size:15px; font-weight:600; color:var(--unk); margin:18px 2px 6px }
  .pm-unavail-hint{ color:var(--mut); font-size:12px; margin:0 2px }
</style>
<script src="/static/htmx.min.js"></script>
</head>
<body>
{% set nav_active = 'pm' %}
{% include '_nav.html' %}
<main>
  <div class="pm-head">
    <h1>{{ t.pm_title }}</h1>
    <span class="sub">{{ t.pm_sub }}</span>
  </div>

  



  <div class="pm-ctl">
    <a class="pm-back" href="/equipment?source={{ source }}&lang={{ lang }}">{{ t.pm_back }}</a>
  </div>

  
  <div id="pm-body"
       hx-get="/equipment/pm/body?{{ frag_qs }}"
       hx-trigger="load" hx-swap="innerHTML">
    <div class="loading"><span class="spin"></span>{{ t.pm_loading }}</div>
  </div>
</main>
</body>
</html>
